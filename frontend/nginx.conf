server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router-dom): unknown paths fall back to index.html
    # instead of a raw nginx 404, so a hard refresh on e.g. /workspace/<id>/ml works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (dist/assets/*) are immutable; index.html itself is not
    # (it references the current hashed asset names) and must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
