[project]
name = "ai-data-intelligence-workspace-backend"
version = "0.1.0"
description = "Backend for the AI Data Intelligence Workspace (Data Intelligence Universe)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Query()/Body() in argument defaults is the framework's
# documented, idiomatic dependency-injection pattern, not the mutable-default-argument
# bug B008 exists to catch — recognizing them as immutable avoids that false positive.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
